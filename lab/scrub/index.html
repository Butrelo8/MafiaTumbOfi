<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de scrub</title>
<style>
  :root { --bg: #000; --ink: #f1eee9; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #pista { height: 500vh; }
  #escena { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  video { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: cover; }
  #info { position: fixed; left: 8px; bottom: 8px; background: rgba(0,0,0,.7); padding: 4px 8px; font: 12px ui-monospace, monospace; }
  @media (prefers-reduced-motion: reduce) { #pista { height: auto; } }
</style>
</head>
<body>
<div id="pista"><div id="escena"><video id="v" muted playsinline preload="auto" aria-label="Movimiento de la cabina a la caja"></video></div></div>
<p id="info" aria-live="off">cargando…</p>
<script>
// Scroll-scrubbed clip (plan §3, phone): progress -> currentTime; one seek in flight, the latest target wins.
const clip = new URLSearchParams(location.search).get("clip") || "v3-540x960-g6b.mp4";
const v = document.getElementById("v"), info = document.getElementById("info");
const S = window.__scrub = { clip, lat: [], pedidos: 0, adelantados: 0, cuadros: 0, desfase: [], listo: false, puede: v.canPlayType('video/mp4; codecs="avc1.42E01E"') };
let enVuelo = null, pendiente = null;
function buscar(t) {
  S.pedidos++;
  if (enVuelo !== null) { if (pendiente !== null) S.adelantados++; pendiente = t; return; }
  enVuelo = performance.now(); v.currentTime = t;
}
v.addEventListener("seeked", () => {
  S.lat.push(performance.now() - enVuelo); enVuelo = null;
  if (pendiente !== null) { const t = pendiente; pendiente = null; enVuelo = performance.now(); v.currentTime = t; }
});
function objetivo() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return Math.min(1, Math.max(0, scrollY / max)) * (v.duration - 1 / 48);
}
addEventListener("scroll", () => { if (S.listo) buscar(objetivo()); }, { passive: true });
if (v.requestVideoFrameCallback) {
  const cb = (now, md) => { S.cuadros++; S.desfase.push(Math.abs(objetivo() - md.mediaTime)); v.requestVideoFrameCallback(cb); };
  v.requestVideoFrameCallback(cb);
}
fetch(clip).then(r => r.blob()).then(b => {  // whole clip in memory: the network is out of the measurement
  S.bytes = b.size; v.src = URL.createObjectURL(b);
  v.addEventListener("loadeddata", () => { S.listo = true; info.textContent = `${clip} · ${(b.size / 1e6).toFixed(2)} MB`; }, { once: true });
});
</script>
</body>
</html>
